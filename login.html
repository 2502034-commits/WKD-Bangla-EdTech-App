<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন ও অ্যাকাউন্ট - WKD EdTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0d6efd, #0dcaf0); height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        .login-card { border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top w-100">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🎯 WKD EdTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">ড্যাশবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link" href="math-solver.html">AI ম্যাথ সলভার</a></li>
                    <li class="nav-item"><a class="nav-link" href="quiz.html">কুইজ</a></li>
                    <li class="nav-item"><a class="nav-link" href="parent-report.html">অভিভাবক রিপোর্ট</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light ms-lg-2 mt-2 mt-lg-0 active" href="login.html">লগইন</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- লগইন ফর্ম কন্টেন্ট -->
    <div class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card p-4 bg-white">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary"><i class="fa-solid fa-right-to-bracket"></i> ড্যাশবোর্ডে প্রবেশ</h3>
                        <p class="text-muted small">আপনার অ্যাকাউন্ট দিয়ে লগইন করুন</p>
                    </div>
                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">ইমেইল বা ফোন নম্বর</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" placeholder="example@gmail.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">পাসওয়ার্ড</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" class="form-control" placeholder="********" required>
                            </div>
                        </div>
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary py-2 fw-bold">লগইন করুন</button>
                        </div>
                        <div class="text-center">
                            <a href="#" class="text-decoration-none small">পাসওয়ার্ড ভুলে গেছেন?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ফুটার -->
    <footer class="bg-dark text-white text-center py-3 w-100">
        <p class="mb-0">© 2026 WKD Bangla EdTech platform. All rights reserved.</p>
    </footer>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            alert('লগইন সফল হয়েছে! এখন আপনাকে ড্যাশবোর্ডে নিয়ে যাওয়া হচ্ছে।');
            window.location.href = 'dashboard.html';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
