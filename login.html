<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - WKD EdTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md mx-4">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-blue-600">WKD EdTech</h2>
            <p class="text-gray-500 mt-2">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        <form onsubmit="event.preventDefault(); alert('লগইন সিস্টেম শীঘ্রই যুক্ত হবে!');">
            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">মোবাইল নম্বর বা ইমেইল</label>
                <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="ইমেইল বা মোবাইল নম্বর দিন" required>
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">পাসওয়ার্ড</label>
                <input type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="পাসওয়ার্ড দিন" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                লগইন করুন
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-blue-500 hover:underline text-sm">← হোম পেজে ফিরে যান</a>
        </div>
    </div>

</body>
</html>
