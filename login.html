<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন ও সাইন-আপ - WKD EdTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f4f7fe; color: #2b3674; }
        .auth-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 35px; max-width: 450px; margin: 50px auto; }
    </style>
</head>
<body>

    <div class="container">
        <div class="auth-card">
            <h3 class="fw-bold text-center text-primary mb-4" id="formTitle">🎯 WKD EdTech-এ লগইন</h3>
            
            <form id="authForm">
                <div class="mb-3 d-none" id="nameGroup">
                    <label class="form-label fw-bold">পূর্ণ নাম</label>
                    <input type="text" id="userName" class="form-control rounded-pill px-3" placeholder="আপনার নাম লিখুন">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">ইমেইল</label>
                    <input type="email" id="userEmail" class="form-control rounded-pill px-3" placeholder="example@mail.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">পাসওয়ার্ড</label>
                    <input type="password" id="userPassword" class="form-control rounded-pill px-3" placeholder="******" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold" id="submitBtn">লগইন করুন</button>
            </form>

            <hr class="my-4">

            <div class="text-center">
                <span id="toggleText">অ্যাকোউন্ট নেই?</span> 
                <a href="#" class="fw-bold text-primary text-decoration-none" id="toggleAuth" onclick="switchMode()">নতুন অ্যাকাউন্ট তৈরি করুন</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let isSignUp = false;

        window.switchMode = function() {
            isSignUp = !isSignUp;
            document.getElementById('formTitle').innerText = isSignUp ? "🎯 নতুন অ্যাকাউন্ট তৈরি করুন" : "🎯 WKD EdTech-এ লগইন";
            document.getElementById('nameGroup').classList.toggle('d-none', !isSignUp);
            document.getElementById('submitBtn').innerText = isSignUp ? "সাইন-আপ করুন" : "লগইন করুন";
            document.getElementById('toggleText').innerText = isSignUp ? "ইতিমধ্যে অ্যাকাউন্ট আছে?" : "অ্যাকোউন্ট নেই?";
            document.getElementById('toggleAuth').innerText = isSignUp ? "লগইন করুন" : "নতুন অ্যাকাউন্ট তৈরি করুন";
        };

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;
            const name = document.getElementById('userName').value;

            try {
                if (isSignUp) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    
                    // Firestore ডাটাবেজে ইউজার প্রোফাইল তৈরি
                    await setDoc(doc(db, "users", user.uid), {
                        name: name || "শিক্ষার্থী",
                        email: email,
                        score: 0,
                        createdAt: new Date().toISOString()
                    });
                    
                    alert("সাইন-আপ সফল হয়েছে! ড্যাশবোর্ডে রিডাইরেক্ট করা হচ্ছে।");
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("সফলভাবে লগইন হয়েছে!");
                }
                window.location.href = "dashboard.html";
            } catch (error) {
                alert("ত্রুটি: " + error.message);
            }
        });
    </script>
</body>
</html>
