<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভিডিও লেসন - WKD EdTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-gray-50 h-screen">

    <!-- হেডার -->
    <nav class="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold">🎬 ভিডিও লেসন</h1>
        <a href="dashboard.html" class="bg-white text-blue-600 px-4 py-1 rounded-full font-semibold text-sm">ফিরে যান</a>
    </nav>

    <div class="p-4 max-w-3xl mx-auto mt-4">
        <!-- ভিডিও প্লেয়ার (ইউটিউব এমবেড) -->
        <div class="bg-black rounded-xl overflow-hidden shadow-lg mb-6 aspect-video">
            <iframe class="w-full h-full" src="https://www.youtube.com/embed/kKKM8Y-u7ds" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <!-- ভিডিওর বিবরণ -->
        <div class="bg-white p-6 rounded-xl shadow border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">নিউটনের গতিসূত্র (সূত্রের বাস্তব ব্যবহার)</h2>
            <p class="text-gray-600 leading-relaxed">
                এই ভিডিওতে আমরা দেখব কীভাবে নিউটনের গতিসূত্র আমাদের দৈনন্দিন জীবনে কাজ করে। বাস হঠাৎ ব্রেক করলে কেন আমরা সামনে ঝুঁকে পড়ি, বা রিকশা চালানোর সময় কীভাবে বল প্রয়োগ হয়—সবকিছু সহজভাবে বুঝিয়ে দেওয়া হয়েছে।
            </p>
        </div>
    </div>

</body>
