    <!-- মেইন কন্টেন্ট -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="lab-card text-center">
                    <h3 class="fw-bold text-primary mb-2"><i class="fa-solid fa-flask text-success me-2"></i>ভার্চুয়াল পেন্ডুলুম ল্যাব</h3>
                    <p class="text-muted mb-4">সরল দোলকের গতি এবং এর দৈর্ঘ্য পরিবর্তনের প্রভাব সচক্ষে পর্যবেক্ষণ করো</p>

                    <!-- ক্যানভাস সিমুলেশন ডিসপ্লে -->
                    <canvas id="pendulumCanvas" width="500" height="300"></canvas>

                    <!-- কন্ট্রোল প্যানেল -->
                    <div class="mt-4 text-start bg-light p-4 rounded-4">
                        <label for="lengthRange" class="form-label fw-bold">পেন্ডুলুমের দৈর্ঘ্য (Length): <span id="lengthVal" class="text-primary">150</span> cm</label>
                        <input type="range" class="form-range" id="lengthRange" min="80" max="220" value="150" oninput="updateLength(this.value)">
                        
                        <div class="d-flex justify-content-between mt-3">
                            <button class="btn btn-success px-4 rounded-pill fw-bold" onclick="startSimulation()"><i class="fa-solid fa-play me-1"></i> শুরু করো</button>
                            <button class="btn btn-danger px-4 rounded-pill fw-bold" onclick="stopSimulation()"><i class="fa-solid fa-pause me-1"></i> থামাও</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 WKD Bangla EdTech platform. All rights reserved.</p>
    </footer>

    <script>
        const canvas = document.getElementById('pendulumCanvas');
        const ctx = canvas.getContext('2d');

        let length = 150; // রডের দৈর্ঘ্য
        let angle = Math.PI / 4; // শুরুর কৌণিক অবস্থান
        let angularVelocity = 0;
        let angularAcceleration = 0;
        let gravity = 0.4;
        let isRunning = true;
        let animationId;

        const originX = 250;
        const originY = 50;

        function updateLength(val) {
            length = parseInt(val);
            document.getElementById('lengthVal').innerText = length;
        }

        function startSimulation() {
            if (!isRunning) {
                isRunning = true;
                animate();
            }
        }

        function stopSimulation() {
            isRunning = false;
            cancelAnimationFrame(animationId);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // পদার্থবিজ্ঞানের সমীকরণ (Simple Harmonic Motion)
            let force = (-1 * gravity / length) * Math.sin(angle);
            angularAcceleration = force;
            angularVelocity += angularAcceleration;
            angularVelocity *= 0.99; // এয়ার রেজিস্ট্যান্স বা ড্যাম্পিং
            angle += angularVelocity;

            // ববের কোঅর্ডিনেট হিসাব
            let bobX = originX + length * Math.sin(angle);
            let bobY = originY + length * Math.cos(angle);

            // সুতা বা রড আঁকা
            ctx.beginPath();
            ctx.moveTo(originX, originY);
            ctx.lineTo(bobX, bobY);
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.stroke();

            // ফিক্সড পয়েন্ট (সাসপেনশন)
            ctx.beginPath();
            ctx.arc(originX, originY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // বব বা গোলক আঁকা
            ctx.beginPath();
            ctx.arc(bobX, bobY, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#f43f5e';
            ctx.fill();
            ctx.closePath();

            if (isRunning) {
                animationId = requestAnimationFrame(animate);
            }
        }

        animate(); // পেজ লোড হওয়ামাত্র অ্যানিমেশন শুরু হবে
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
