<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ম্যাথ সলভার - WKD EdTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-gray-50 h-screen">

    <!-- হেডার -->
    <nav class="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold">🤖 AI ম্যাথ সলভার</h1>
        <a href="dashboard.html" class="bg-white text-blue-600 px-4 py-1 rounded-full font-semibold text-sm">ফিরে যান</a>
    </nav>

    <div class="p-4 max-w-2xl mx-auto mt-6">
        <!-- ইনপুট এরিয়া -->
        <div class="bg-white p-6 rounded-xl shadow border border-gray-100 mb-6">
            <label class="block text-gray-700 font-semibold mb-2">আপনার গণিতের প্রশ্নটি লিখুন:</label>
            <textarea id="math-input" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 mb-4" rows="4" placeholder="উদাহরণ: 2x + 5 = 15, তবে x এর মান কত?"></textarea>
            
            <button id="solve-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                সমাধান করুন
            </button>
        </div>

        <!-- আউটপুট এরিয়া (প্রথমে লুকানো থাকবে) -->
        <div id="result-area" class="bg-green-50 p-6 rounded-xl shadow border border-green-200 hidden">
            <h3 class="text-xl font-bold text-green-800 mb-4">AI শিক্ষকের উত্তর:</h3>
            <div id="result-text" class="text-gray-800 leading-relaxed whitespace-pre-wrap">
                <!-- এখানে উত্তর আসবে -->
            </div>
        </div>
    </div>

    <script>
        document.getElementById('solve-btn').addEventListener('click', () => {
            const input = document.getElementById('math-input').value;
            const resultArea = document.getElementById('result-area');
            const resultText = document.getElementById('result-text');
            const btn = document.getElementById('solve-btn');

            if (!input.trim()) {
                alert('অনুগ্রহ করে আগে একটি প্রশ্ন লিখুন!');
                return;
            }

            // লোডিং স্টেট
            btn.innerText = "AI চিন্তা করছে...";
            btn.disabled = true;

            // আপাতত ডেমো আউটপুট (পরবর্তীতে এখানে আসল AI যুক্ত হবে)
            setTimeout(() => {
                resultArea.classList.remove('hidden');
                resultText.innerHTML = `আপনার প্রশ্ন: <strong>${input}</strong><br><br>
                <em>(এটি একটি ডেমো উত্তর। শীঘ্রই এখানে আসল AI যুক্ত হবে)</em><br><br>
                <strong>ধাপ ১:</strong> প্রথমে চলকগুলোকে একপাশে নেই।<br>
                <strong>ধাপ ২:</strong> উভয় পক্ষ থেকে সাধারণ সংখ্যা বিয়োগ করি।<br>
                <strong>ধাপ ৩:</strong> অবশেষে x এর মান বের করি।`;
                
                btn.innerText = "সমাধান করুন";
                btn.disabled = false;
            }, 1500); // ১.৫ সেকেন্ড পর উত্তর দেখাবে
        });
    </script>
</body>
</html>
