<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI টিউটর ও ভয়েস সলভার - WKD EdTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f4f7fe; color: #2b3674; }
        .chat-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 25px; }
        .mic-btn { width: 60px; height: 60px; border-radius: 50%; font-size: 22px; transition: all 0.3s; }
        .listening { animation: pulse 1.5s infinite; background-color: #dc3545 !important; border-color: #dc3545 !important; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(220, 53, 69, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🎯 WKD EdTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">ড্যাশবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link active" href="math-solver.html">AI টিউটর</a></li>
                    <li class="nav-item"><a class="nav-link" href="quiz.html">কুইজ</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">লিডারবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link" href="discussion.html">ফোরাম</a></li>
                    <li class="nav-item"><a class="nav-link" href="parent-report.html">অভিভাবক রিপোর্ট</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h3 class="fw-bold text-primary mb-2"><i class="fa-solid fa-microphone-lines"></i> ভয়েস-এনাবেল্ড AI টিউটর</h3>
                <p class="text-muted mb-4">মুখে কথা বলে প্রশ্ন করো অথবা নিচে টাইপ করে সমাধান বুঝে নাও</p>

                <div class="chat-card">
                    <!-- ভয়েস সার্চ বাটন -->
                    <div class="mb-4">
                        <button id="micBtn" class="btn btn-primary mic-btn shadow" onclick="toggleVoiceRecognition()">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <p id="micStatus" class="small text-muted mt-2 mb-0">কথা বলতে মাইক বাটনে ট্যাপ করো</p>
                    </div>

                    <!-- টেক্সট ইনপুট -->
                    <div class="input-group mb-4">
                        <input type="text" id="questionInput" class="form-control form-control-lg rounded-start-pill" placeholder="যেমন: 'অভিকর্ষজ ত্বরণ কি?' বা অংকটি লেখো...">
                        <button class="btn btn-primary px-4 rounded-end-pill fw-bold" onclick="solveProblem()">
                            <i class="fa-solid fa-paper-plane me-1"></i> সমাধান করো
                        </button>
                    </div>

                    <!-- আউটপুট ডিসপ্লে -->
                    <div id="outputCard" class="text-start p-4 rounded-4 bg-light d-none">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="fw-bold text-success mb-0"><i class="fa-solid fa-robot me-2"></i>AI টিউটরের সমাধান:</h5>
                            <button class="btn btn-sm btn-outline-secondary rounded-circle" onclick="speakResponse()">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        <p id="solutionText" class="mb-0 fs-5"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 WKD Bangla EdTech platform. All rights reserved.</p>
    </footer>

    <script>
        let recognition;
        let isListening = false;

        // ভয়েস ইনপুট (Speech Recognition) সেটআপ
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'bn-BD'; // বাংলা ভয়েস রিকগনিশন
            recognition.continuous = false;

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('questionInput').value = transcript;
                stopMicUI();
                solveProblem(); // স্বয়ংক্রিয়ভাবে উত্তর খুঁজবে
            };

            recognition.onerror = function() {
                stopMicUI();
                alert('ভয়েস শুনতে সমস্যা হয়েছে। দয়া করে আবার চেষ্টা করুন।');
            };

            recognition.onend = function() {
                stopMicUI();
            };
        } else {
            document.getElementById('micBtn').disabled = true;
            document.getElementById('micStatus').innerText = 'আপনার ব্রাউজার ভয়েস ইনপুট সাপোর্ট করে না।';
        }

        function toggleVoiceRecognition() {
            if (!recognition) return;
            if (!isListening) {
                recognition.start();
                isListening = true;
                const btn = document.getElementById('micBtn');
                btn.classList.add('listening');
                document.getElementById('micStatus').innerText = 'কথা শুনছি... এখন বলুন!';
            } else {
                recognition.stop();
                stopMicUI();
            }
        }

        function stopMicUI() {
            isListening = false;
            const btn = document.getElementById('micBtn');
            btn.classList.remove('listening');
            document.getElementById('micStatus').innerText = 'কথা বলতে মাইক বাটনে ট্যাপ করো';
        }

        // সিমুলেটেড AI উত্তর ও উত্তর পড়ে শোনানো
        function solveProblem() {
            const query = document.getElementById('questionInput').value.trim();
            if (!query) return;

            let answer = "আপনার প্রশ্নের উত্তর তৈরি হচ্ছে...";

            if (query.includes("অভিকর্ষজ ত্বরণ") || query.includes("g")) {
                answer = "অভিকর্ষ বলের প্রভাবে ভূ-পৃষ্ঠে মুক্তভাবে পড়ন্ত কোনো বস্তুর বেগ বৃদ্ধির হারকে অভিকর্ষজ ত্বরণ (g) বলে। এর আদর্শ মান ৯.৮ m/s²।";
            } else if (query.includes("ভেক্টর") || query.includes("vector")) {
                answer = "যে সকল ভৌত রাশিকে সম্পূর্ণরূপে প্রকাশ করার জন্য মান ও দিক উভয়ের প্রয়োজন হয়, তাদেরকে ভেক্টর রাশি বলে। যেমন: বেগ, বল, সরণ ইত্যাদি।";
            } else {
                answer = `"${query}" প্রশ্নটির সমাধান: গাণিতিক সূত্র অনুযায়ী এটি একটি মৌলিক সমস্যা। সঠিক থিওরি প্রয়োগ করে ধাপগুলো সম্পন্ন করুন।`;
            }

            document.getElementById('solutionText').innerText = answer;
            document.getElementById('outputCard').classList.remove('d-none');
            speakResponse(); // উত্তর স্বয়ংক্রিয়ভাবে পড়ে শোনাবে
        }

        // টেক্সট-টু-স্পিচ (Speech Synthesis)
        function speakResponse() {
            const text = document.getElementById('solutionText').innerText;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // আগের কোনো কথা থাকলে তা থামানো
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD'; // বাংলা ভয়েস
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((reg) => console.log('Service Worker Registered!', reg))
                    .catch((err) => console.log('Service Worker Failed!', err));
            });
        }
        </script>
    
</body>
</html>
