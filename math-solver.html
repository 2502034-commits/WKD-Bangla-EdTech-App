<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ম্যাথ সলভার - WKD EdTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Hind Siliguri', sans-serif; } 
        .calc-btn { user-select: none; }
    </style>
</head>
<body class="bg-gray-50 h-screen">

    <!-- হেডার -->
    <nav class="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">🤖 AI ম্যাথ সলভার</h1>
        <a href="dashboard.html" class="bg-white text-blue-600 px-4 py-1 rounded-full font-semibold text-sm hover:bg-gray-100 transition">ফিরে যান</a>
    </nav>

    <div class="p-4 max-w-2xl mx-auto mt-4 pb-10">
        
        <!-- ইনপুট এরিয়া -->
        <div class="bg-white p-6 rounded-xl shadow border border-gray-100 mb-6">
            <div class="flex justify-between items-end mb-2">
                <label class="block text-gray-700 font-semibold">আপনার গণিতের প্রশ্নটি লিখুন:</label>
                <button id="toggle-calc" class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-semibold border border-indigo-200">🧮 কিবোর্ড</button>
            </div>
            
            <textarea id="math-input" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 mb-3 text-lg" rows="3" placeholder="উদাহরণ: 2x + 5 = 15"></textarea>
            
            <!-- সায়েন্টিফিক ক্যালকুলেটর কিবোর্ড -->
            <div id="calculator-keyboard" class="hidden bg-gray-100 p-2 rounded-lg mb-4 border border-gray-200 shadow-inner">
                <div class="grid grid-cols-5 gap-1.5">
                    <button onclick="insertSymbol('sin(')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">sin</button>
                    <button onclick="insertSymbol('cos(')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">cos</button>
                    <button onclick="insertSymbol('tan(')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">tan</button>
                    <button onclick="insertSymbol('log(')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">log</button>
                    <button onclick="insertSymbol('ln(')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">ln</button>

                    <button onclick="insertSymbol('√')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">√</button>
                    <button onclick="insertSymbol('^2')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">x²</button>
                    <button onclick="insertSymbol('^')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">^</button>
                    <button onclick="insertSymbol('(')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">(</button>
                    <button onclick="insertSymbol(')')" class="calc-btn bg-gray-200 text-gray-800 font-semibold py-2 rounded shadow-sm text-sm active:bg-gray-300">)</button>

                    <button onclick="insertSymbol('7')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">7</button>
                    <button onclick="insertSymbol('8')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">8</button>
                    <button onclick="insertSymbol('9')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">9</button>
                    <button onclick="deleteChar()" class="calc-btn bg-red-100 text-red-600 font-bold py-2 rounded shadow-sm text-sm active:bg-red-200">DEL</button>
                    <button onclick="clearAll()" class="calc-btn bg-red-500 text-white font-bold py-2 rounded shadow-sm text-sm active:bg-red-600">AC</button>

                    <button onclick="insertSymbol('4')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">4</button>
                    <button onclick="insertSymbol('5')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">5</button>
                    <button onclick="insertSymbol('6')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">6</button>
                    <button onclick="insertSymbol('×')" class="calc-btn bg-blue-100 text-blue-800 font-bold py-2 rounded shadow-sm text-lg active:bg-blue-200">×</button>
                    <button onclick="insertSymbol('÷')" class="calc-btn bg-blue-100 text-blue-800 font-bold py-2 rounded shadow-sm text-lg active:bg-blue-200">÷</button>

                    <button onclick="insertSymbol('1')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">1</button>
                    <button onclick="insertSymbol('2')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">2</button>
                    <button onclick="insertSymbol('3')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">3</button>
                    <button onclick="insertSymbol('+')" class="calc-btn bg-blue-100 text-blue-800 font-bold py-2 rounded shadow-sm text-lg active:bg-blue-200">+</button>
                    <button onclick="insertSymbol('-')" class="calc-btn bg-blue-100 text-blue-800 font-bold py-2 rounded shadow-sm text-lg active:bg-blue-200">-</button>

                    <button onclick="insertSymbol('0')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">0</button>
                    <button onclick="insertSymbol('.')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">.</button>
                    <button onclick="insertSymbol('x')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">x</button>
                    <button onclick="insertSymbol('y')" class="calc-btn bg-white text-gray-900 font-bold py-2 rounded shadow-sm text-lg active:bg-gray-200">y</button>
                    <button onclick="insertSymbol('=')" class="calc-btn bg-indigo-500 text-white font-bold py-2 rounded shadow-sm text-lg active:bg-indigo-600">=</button>
                </div>
            </div>

            <button id="solve-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md">
                সমাধান করুন
            </button>
        </div>

        <!-- আউটপুট এরিয়া -->
        <div id="result-area" class="bg-green-50 p-6 rounded-xl shadow border border-green-200 hidden">
            <h3 class="text-xl font-bold text-green-800 mb-4 flex items-center">
                <span class="mr-2">👨‍🏫</span> AI শিক্ষকের উত্তর:
            </h3>
            <div id="result-text" class="text-gray-800 leading-relaxed whitespace-pre-wrap text-lg">
                <!-- এখানে উত্তর আসবে -->
            </div>
        </div>
    </div>

    <script>
        // ⚠️ এখানে আপনার Gemini API Key বসান ⚠️
        const GEMINI_API_KEY ="AIzaSyCnU4bACG9yo4HDUyT6vYztW14GZfAJxtM";
        
        // কিবোর্ড শো/হাইড করার লজিক
const toggleBtn = document.getElementById('toggle-calc');
const keyboard = document.getElementById('calculator-keyboard');

toggleBtn.addEventListener('click', () => {
    keyboard.classList.toggle('hidden');
    if (keyboard.classList.contains('hidden')) {
        toggleBtn.innerText = "🧮 কিবোর্ড";
        toggleBtn.classList.replace('bg-indigo-500', 'bg-indigo-100');
        toggleBtn.classList.replace('text-white', 'text-indigo-700');
    } else {
        toggleBtn.innerText = "⌨️ লুকান";
        toggleBtn.classList.replace('bg-indigo-100', 'bg-indigo-500');
        toggleBtn.classList.replace('text-indigo-700', 'text-white');
    }
});

// চিহ্ন বসানোর ফাংশন
function insertSymbol(symbol) {
    const input = document.getElementById('math-input');
    const startPos = input.selectionStart;
    const endPos = input.selectionEnd;
    input.value = input.value.substring(0, startPos) + symbol + input.value.substring(endPos, input.value.length);
    input.selectionStart = input.selectionEnd = startPos + symbol.length;
    input.focus();
}

function deleteChar() {
    const input = document.getElementById('math-input');
    const startPos = input.selectionStart;
    const endPos = input.selectionEnd;
    if (startPos === endPos && startPos > 0) {
        input.value = input.value.substring(0, startPos - 1) + input.value.substring(startPos, input.value.length);
        input.selectionStart = input.selectionEnd = startPos - 1;
    } else {
        input.value = input.value.substring(0, startPos) + input.value.substring(endPos, input.value.length);
        input.selectionStart = input.selectionEnd = startPos;
    }
    input.focus();
}

function clearAll() {
    document.getElementById('math-input').value = '';
    document.getElementById('math-input').focus();
}

// ==========================================
// 🤖 আসল AI-এর সাথে যুক্ত করার কোড (Debug Mode)
// ==========================================
document.getElementById('solve-btn').addEventListener('click', async () => {
    const input = document.getElementById('math-input').value;
    const resultArea = document.getElementById('result-area');
    const resultText = document.getElementById('result-text');
    const btn = document.getElementById('solve-btn');

    if (!input.trim()) {
        alert('অনুগ্রহ করে আগে একটি প্রশ্ন লিখুন!');
        return;
    }

    btn.innerHTML = "⏳ AI চিন্তা করছে...";
    btn.disabled = true;
    resultArea.classList.remove('hidden');
    resultText.innerHTML = `<span class="animate-pulse">উত্তর তৈরি হচ্ছে, অপেক্ষা করুন...</span>`;

    const prompt = `আপনি একজন গণিত শিক্ষক। শিক্ষার্থীর প্রশ্ন: "${input}"। তাকে সহজ বাংলায় ধাপে ধাপে সমাধান বুঝিয়ে দাও।`;

    try {
        // মডেলের নাম gemini-1.5-flash দেওয়া হলো
             const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`, {
               method: 'POST',
                 headers: {
              'Content-Type': 'application/json'
            },
               body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
            })
         });

        const data = await response.json();

        // যদি গুগলের সার্ভার থেকে কোনো এরর আসে
        if (data.error) {
            alert("গুগল API এরর: " + data.error.message);
            resultText.innerHTML = `<span class="text-red-500">API এরর: ${data.error.message}</span>`;
            return;
        }

        // যদি সফলভাবে উত্তর আসে
        if (data.candidates && data.candidates.length > 0) {
            let aiResponse = data.candidates[0].content.parts[0].text;
            aiResponse = aiResponse.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            resultText.innerHTML = aiResponse;
        } else {
            alert("অজানা ডাটা: " + JSON.stringify(data));
            resultText.innerHTML = `<span class="text-red-500">উত্তর পাওয়া যায়নি। ডাটা ফরম্যাট ভুল।</span>`;
        }

    } catch (error) {
        // যদি ইন্টারনেট বা CORS সমস্যা হয়
        alert("সিস্টেম এরর: " + error.message);
        resultText.innerHTML = `<span class="text-red-500">সিস্টেম এরর: ${error.message}</span>`;
    } finally {
        btn.innerHTML = "সমাধান করুন";
        btn.disabled = false;
    }
});
    </script>
</body>
</html>
