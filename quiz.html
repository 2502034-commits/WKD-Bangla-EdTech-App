<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কুইজ ও অ্যাসেসমেন্ট - WKD EdTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .quiz-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .option-btn { text-align: left; transition: all 0.2s; }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🎯 WKD EdTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">ড্যাশবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link" href="math-solver.html">AI ম্যাথ সলভার</a></li>
                    <li class="nav-item"><a class="nav-link active" href="quiz.html">কুইজ</a></li>
                    <li class="nav-item"><a class="nav-link" href="parent-report.html">অভিভাবক রিপোর্ট</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light ms-lg-2 mt-2 mt-lg-0" href="login.html">লগইন</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- কুইজ সেকশন -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card quiz-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold text-primary mb-0"><i class="fa-solid fa-pen-to-square"></i> সাপ্তাহিক অ্যাসেসমেন্ট</h4>
                        <span class="badge bg-warning text-dark">প্রশ্ন ১ / ৩</span>
                    </div>
                    <hr>
                    <div id="quiz-body">
                        <h5 class="fw-bold mb-4">প্রশ্ন: নিচের কোনটি নবায়নযোগ্য শক্তির উৎস নয়?</h5>
                        <div class="d-grid gap-3">
                            <button class="btn btn-outline-primary option-btn p-3" onclick="selectOption(this, false)">ক) সোলার এনার্জি (সৌরশক্তি)</button>
                            <button class="btn btn-outline-primary option-btn p-3" onclick="selectOption(this, false)">খ) বায়ুপ্রবাহ শক্তি</button>
                            <button class="btn btn-outline-primary option-btn p-3" onclick="selectOption(this, true)">গ) কয়লা ও প্রাকৃতিক গ্যাস</button>
                            <button class="btn btn-outline-primary option-btn p-3" onclick="selectOption(this, false)">ঘ) জোয়ার-ভাটা শক্তি</button>
                        </div>
                        <button class="btn btn-primary w-100 mt-4 py-2 fw-bold" id="nextBtn" onclick="nextQuestion()" disabled>পরবর্তী প্রশ্ন</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ফুটার -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 WKD Bangla EdTech platform. All rights reserved.</p>
    </footer>

    <!-- সাধারণ স্ক্রিপ্ট -->
    <script>
        function selectOption(button, isCorrect) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                btn.classList.remove('btn-primary', 'btn-success', 'btn-danger');
                btn.classList.add('btn-outline-primary');
            });

            if (isCorrect) {
                button.classList.remove('btn-outline-primary');
                button.classList.add('btn-success');
            } else {
                button.classList.remove('btn-outline-primary');
                button.classList.add('btn-danger');
            }

            document.getElementById('nextBtn').removeAttribute('disabled');
        }

        function nextQuestion() {
            alert('অভিনন্দন! কুইজ ডেমো সফলভাবে সম্পন্ন হয়েছে। পূর্ণাঙ্গ প্রজেক্টে এখানে পরবর্তী প্রশ্ন লোড হবে।');
            location.reload();
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
