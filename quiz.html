<head>
    <meta charset="UTF-8">

    <title>সাপ্তাহিক কুইজ ও অ্যাসেসমেন্ট - WKD EdTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .quiz-card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; }
        .option-btn { width: 100%; text-align: left; margin-bottom: 10px; padding: 12px 15px; border-radius: 10px; border: 1px solid #ced4da; transition: all 0.2s; background: #fff; }
        .option-btn:hover { background-color: #e9ecef; border-color: #0d6efd; }
        .selected-option { background-color: #0d6efd !important; color: white !important; border-color: #0d6efd !important; }
        .subject-badge { font-size: 14px; padding: 6px 12px; border-radius: 20px; }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🎯 WKD EdTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">ড্যাশবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link" href="math-solver.html">AI ম্যাথ সলভার</a></li>
                    <li class="nav-item"><a class="nav-link active" href="quiz.html">কুইজ</a></li>
                    <li class="nav-item"><a class="nav-link" href="video.html">ভার্চুয়াল ল্যাব</a></li>
                    <li class="nav-item"><a class="nav-link" href="parent-report.html">অভিভাবক রিপোর্ট</a></li>
                    <li class="nav-item"><a class="btn btn-outline-light ms-lg-2 mt-2 mt-lg-0" href="login.html">লগইন</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- কুইজ সেকশন -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- কন্টেন্ট ফিল্টার (শ্রেণি ও বিষয় নির্বাচন) -->
                <div class="card p-3 mb-4 border-0 shadow-sm">
                    <h5 class="fw-bold text-primary mb-3"><i class="fa-solid fa-filter"></i> বিষয় ও অধ্যায় নির্বাচন করো</h5>
                    <div class="row g-2">
                        <div class="col-md-6">
                            <label class="form-label small text-muted fw-bold">বিষয়:</label>
                            <select id="subjectSelect" class="form-select" onchange="loadQuiz()">
                                <option value="physics">পদার্থবিজ্ঞান (Physics)</option>
                                <option value="chemistry">রসায়ন (Chemistry)</option>
                                <option value="math">উচ্চতর গণিত (Higher Math)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small text-muted fw-bold">শ্রেণি:</label>
                            <select id="classSelect" class="form-select" onchange="loadQuiz()">
                                <option value="9-10">৯ম - ১০ম শ্রেণি (NCTB)</option>
                                <option value="11-12">একাদশ - দ্বাদশ শ্রেণি (HSC)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- কুইজ বক্স -->
                <div class="quiz-card" id="quizBox">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="badge bg-primary subject-badge" id="quizTag">পদার্থবিজ্ঞান</span>
                        <span class="text-muted fw-bold" id="questionTracker">প্রশ্ন ১ / ৩</span>
                    </div>

                    <h4 class="fw-bold mb-4" id="questionText">লোড হচ্ছে...</h4>

                    <div id="optionsContainer">
                        <!-- অপশনগুলো ডায়নামিকালি আসবে -->
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button class="btn btn-secondary px-4" id="prevBtn" onclick="prevQuestion()" disabled>আগেরটি</button>
                        <button class="btn btn-primary px-4" id="nextBtn" onclick="nextQuestion()">পরবর্তী</button>
                    </div>
                </div>

                <!-- রেজাল্ট কার্ড -->
                <div class="quiz-card text-center d-none" id="resultCard">
                    <h2 class="text-success mb-3">🏆 কুইজ সম্পন্ন হয়েছে!</h2>
                    <p class="fs-5">তোমার মোট প্রাপ্ত নম্বর: <strong id="scoreText" class="text-primary">০</strong></p>
                    <div class="progress mb-4" style="height: 25px;">
                        <div class="progress-bar bg-success" id="progressBar" style="width: 0%;">০%</div>
                    </div>
                    <button class="btn btn-outline-primary btn-lg" onclick="resetQuiz()">পুনরায় পরীক্ষা দাও</button>
                </div>

            </div>
        </div>
    </div>

    <!-- ফুটার -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 WKD Bangla EdTech platform. All rights reserved.</p>
    </footer>

    <!-- কুইজ ডাটা ও লজিক -->
    <script>
        // NCTB কারিকুলাম কুইজ ডাটাবেস
        const quizDatabase = {
            "physics": [
                {
                    q: "নিচের কোনটি ভেক্টর রাশি?",
                    options: ["ভর", "দূরত্ব", "বেগ", "কাজ"],
                    correct: 2
                },
                {
                    q: "কোনো বস্তুর মুক্তভাবে পড়ন্ত অবস্থায় ত্বরণ (g) এর মান কত?",
                    options: ["9.8 m/s²", "9.8 cm/s²", "10 m/s²", "8.9 m/s²"],
                    correct: 0
                },
                {
                    q: "নিউটনের প্রথম সূত্র থেকে কিসের ধারণা পাওয়া যায়?",
                    options: ["বল ও জড়তা", "ত্বরণ", "ভরবেগ", "শক্তি"],
                    correct: 0
                }
            ],
            "chemistry": [
                {
                    q: "পানির রাসায়নিক সংকেত কোনটি?",
                    options: ["CO2", "H2O", "NaCl", "HCl"],
                    correct: 1
                },
                {
                    q: "পর্যায় সারণীর ১ম গ্রুপের মৌলগুলোকে কী বলা হয়?",
                    options: ["মৃদক্ষার ধাতু", "হ্যালোজেন", "ক্ষার ধাতু", "নিষ্ক্রিয় গ্যাস"],
                    correct: 2
                },
                {
                    q: "এসিডের পিএইচ (pH) মান কত হয়ে থাকে?",
                    options: ["৭ এর কম", "৭ এর সমান", "৭ এর বেশি", "১৪ এর বেশি"],
                    correct: 0
                }
            ],
            "math": [
                {
                    q: "sin²θ + cos²θ = কত?",
                    options: ["0", "1", "-1", "2"],
                    correct: 1
                },
                {
                    q: "সমকোণী ত্রিভুজের বৃহত্তম বাহুকে কী বলা হয়?",
                    options: ["লম্ব", "ভূমি", "অতিভুজ", "মধ্যমা"],
                    correct: 2
                },
                {
                    q: "log₁₀(100) এর মান কত?",
                    options: ["1", "2", "10", "100"],
                    correct: 1
                }
            ]
        };

        let currentSubjectQuestions = [];
        let currentIndex = 0;
        let selectedAnswers = {};

        function loadQuiz() {
            const subject = document.getElementById('subjectSelect').value;
            currentSubjectQuestions = quizDatabase[subject] || [];
            currentIndex = 0;
            selectedAnswers = {};
            
            document.getElementById('quizTag').innerText = document.getElementById('subjectSelect').options[document.getElementById('subjectSelect').selectedIndex].text.split(' ')[0];
            document.getElementById('quizBox').classList.remove('d-none');
            document.getElementById('resultCard').classList.add('d-none');
            
            showQuestion();
        }

        function showQuestion() {
            const q = currentSubjectQuestions[currentIndex];
            document.getElementById('questionTracker').innerText = `প্রশ্ন ${currentIndex + 1} / ${currentSubjectQuestions.length}`;
            document.getElementById('questionText').innerText = q.q;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (selectedAnswers[currentIndex] === i) {
                    btn.classList.add('selected-option');
                }
                btn.innerText = `${String.fromCharCode(65 + i)}) ${opt}`;
                btn.onclick = () => selectOption(i);
                container.appendChild(btn);
            });

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            if (currentIndex === currentSubjectQuestions.length - 1) {
                document.getElementById('nextBtn').innerText = "সাবমিট করো";
                document.getElementById('nextBtn').className = "btn btn-success px-4";
            } else {
                document.getElementById('nextBtn').innerText = "পরবর্তী";
                document.getElementById('nextBtn').className = "btn btn-primary px-4";
            }
        }

        function selectOption(index) {
            selectedAnswers[currentIndex] = index;
            showQuestion();
        }

        function nextQuestion() {
            if (currentIndex < currentSubjectQuestions.length - 1) {
                currentIndex++;
                showQuestion();
            } else {
                calculateResult();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                showQuestion();
            }
        }

        function calculateResult() {
            let score = 0;
            currentSubjectQuestions.forEach((q, i) => {
                if (selectedAnswers[i] === q.correct) {
                    score++;
                }
            });

            const total = currentSubjectQuestions.length;
            const percentage = Math.round((score / total) * 100);

            document.getElementById('quizBox').classList.add('d-none');
            document.getElementById('resultCard').classList.remove('d-none');
            document.getElementById('scoreText').innerText = `${score} / ${total}`;
            
            const pBar = document.getElementById('progressBar');
            pBar.style.width = percentage + '%';
            pBar.innerText = percentage + '%';
        }

        function resetQuiz() {
            loadQuiz();
        }

        // শুরুতে লোড
        window.onload = loadQuiz;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
