<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইন্টারঅ্যাক্টিভ কুইজ - WKD EdTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f4f7fe; color: #2b3674; }
        .quiz-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 30px; }
        .option-btn { text-align: left; border: 2px solid #e2e8f0; border-radius: 12px; padding: 12px 20px; margin-bottom: 10px; transition: all 0.2s; font-weight: 600; background: white; color: #2b3674; width: 100%; }
        .option-btn:hover { border-color: #4318ff; background: rgba(67, 24, 255, 0.03); }
        .option-btn.selected { background: #4318ff; color: white; border-color: #4318ff; }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🎯 WKD EdTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">ড্যাশবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link" href="math-solver.html">AI টিউটর</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-info" href="quiz.html">কুইজ</a></li>
                    <li class="nav-item"><a class="nav-link" href="lessons.html">লেকচার</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">লিডারবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link" href="discussion.html">ফোরাম</a></li>
                    <li class="nav-item"><a class="nav-link" href="parent-report.html">অভিভাবক রিপোর্ট</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- মেইন কন্টেন্ট -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="quiz-card">
                    <div id="quiz-container">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge bg-primary px-3 py-2 rounded-pill" id="questionNum">প্রশ্ন ১ / ৩</span>
                            <span class="fw-bold text-muted">পয়েন্ট: <span id="currentPoints" class="text-primary">০</span></span>
                        </div>
                        <h4 id="questionText" class="fw-bold mb-4">প্রশ্ন লোড হচ্ছে...</h4>
                        <div id="optionsContainer" class="mb-4">
                            <!-- অপশনগুলো ডাইনামিক্যালি লোড হবে -->
                        </div>
                        <button id="nextBtn" class="btn btn-primary w-100 py-2 rounded-pill fw-bold" onclick="nextQuestion()" disabled>পরবর্তী প্রশ্ন</button>
                    </div>

                    <!-- রেজাল্ট সেকশন (কুইজ শেষ হলে দেখাবে) -->
                    <div id="result-container" class="text-center d-none">
                        <div class="mb-3 text-success fs-1">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <h3 class="fw-bold mb-2">অভিনন্দন! কুইজ সম্পন্ন হয়েছে।</h3>
                        <p class="text-muted mb-4">আপনার অর্জিত মোট পয়েন্ট: <span id="finalScore" class="fw-bold text-primary fs-4">০</span></p>
                        <div class="d-flex justify-content-center gap-2">
                            <button class="btn btn-primary rounded-pill px-4 fw-bold" onclick="restartQuiz()">다বার কুইজ খেলুন</button>
                            <a href="leaderboard.html" class="btn btn-outline-primary rounded-pill px-4 fw-bold">লিডারবোর্ড দেখুন</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 WKD Bangla EdTech platform. All rights reserved.</p>
    </footer>

    <script>
        const quizData = [
            {
                question: "অভিকর্ষজ ত্বরণ 'g' এর আদর্শ মান কত?",
                options: ["৯.৮ m/s²", "৮.৯ m/s²", "১০.৫ m/s²", "৯.০ m/s²"],
                correct: 0
            },
            {
                question: "যে রাশির মান ও দিক উভয়ই আছে তাকে কী বলে?",
                options: ["স্কেলার রাশি", "ভেক্টর রাশি", "মৌলিক রাশি", "লব্ধ রাশি"],
                correct: 1
            },
            {
                question: "বিশুদ্ধ পানির pH এর মান কত?",
                options: ["৫", "৬", "৭", "৮"],
                correct: 2
            }
        ];

        let currentQuestion = 0;
        let score = parseInt(localStorage.getItem('wkd_quiz_score') || '30');
        let selectedOption = null;

        function loadQuiz() {
            selectedOption = null;
            document.getElementById('nextBtn').disabled = true;
            const currentQ = quizData[currentQuestion];
            
            document.getElementById('questionNum').innerText = `প্রশ্ন ${currentQuestion + 1} / ${quizData.length}`;
            document.getElementById('questionText').innerText = currentQ.question;
            document.getElementById('currentPoints').innerText = score;

            const optionsHTML = currentQ.options.map((opt, index) => `
                <button class="option-btn" onclick="selectOption(${index}, this)">${opt}</button>
            `).join('');
            
            document.getElementById('optionsContainer').innerHTML = optionsHTML;
        }

        function selectOption(index, element) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            selectedOption = index;
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            if (selectedOption === quizData[currentQuestion].correct) {
                score += 10; // সঠিক উত্তরের জন্য ১০ পয়েন্ট যোগ
                localStorage.setItem('wkd_quiz_score', score);
            }

            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuiz();
            } else {
                document.getElementById('quiz-container').classList.add('d-none');
                document.getElementById('result-container').classList.remove('d-none');
                document.getElementById('finalScore').innerText = score + ' Pts';
            }
        }

        function restartQuiz() {
            currentQuestion = 0;
            document.getElementById('quiz-container').classList.remove('d-none');
            document.getElementById('result-container').classList.add('d-none');
            loadQuiz();
        }

        window.onload = loadQuiz;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
