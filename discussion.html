<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডিসকাশন ফোরাম - WKD EdTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f4f7fe; color: #2b3674; }
        .forum-card { background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; margin-bottom: 20px; }
        .post-box { background: #f8f9fa; border-radius: 12px; padding: 15px; margin-bottom: 15px; border-left: 4px solid #4318ff; }
    </style>
</head>
<body>

    <!-- নেভিগেশন বার -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🎯 WKD EdTech</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">ড্যাশবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link" href="math-solver.html">AI টিউটর</a></li>
                    <li class="nav-item"><a class="nav-link" href="quiz.html">কুইজ</a></li>
                    <li class="nav-item"><a class="nav-link" href="lessons.html">লেকচার</a></li>
                    <li class="nav-item"><a class="nav-link" href="leaderboard.html">লিডারবোর্ড</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-info" href="discussion.html">ফোরাম</a></li>
                    <li class="nav-item"><a class="nav-link" href="parent-report.html">অভিভাবক রিপোর্ট</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- মেইন কন্টেন্ট -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- পোস্ট করার ফর্ম -->
                <div class="forum-card">
                    <h4 class="fw-bold text-primary mb-3"><i class="fa-solid fa-comments me-2"></i>স্টুডেন্ট ডিসকাশন ফোরাম</h4>
                    <p class="text-muted small mb-4">তোমার কোনো প্রশ্ন বা সমস্যা থাকলে নিচে লিখে পোস্ট করো, সহপাঠীরা উত্তর দেবে।</p>
                    
                    <div class="mb-3">
                        <input type="text" id="authorInput" class="form-control mb-2 rounded-pill px-3" placeholder="তোমার নাম...">
                        <textarea id="postInput" class="form-control rounded-4 p-3" rows="3" placeholder="আজ কী শিখলে বা কোন সমস্যায় পড়েছ তা এখানে লেখো..."></textarea>
                    </div>
                    <button class="btn btn-primary rounded-pill px-4 fw-bold" onclick="addPost()">
                        <i class="fa-solid fa-paper-plane me-1"></i> পোস্ট করুন
                    </button>
                </div>

                <!-- পোস্ট ফিড -->
                <div class="forum-card">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-stream text-success me-2"></i>সাম্প্রতিক আলোচনা</h5>
                    <div id="postsContainer">
                        <!-- ডাইনামিক পোস্টগুলো এখানে লোড হবে -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">© 2026 WKD Bangla EdTech platform. All rights reserved.</p>
    </footer>

    <script>
        let posts = JSON.parse(localStorage.getItem('wkd_forum_posts') || JSON.stringify([
            { author: "রাহিম আহমেদ", text: "পদার্থবিজ্ঞানের ভেক্টরের ডট গুণন নিয়ে কারো কি কোনো নোট আছে?", time: "আজ, সকাল ১০:১৫" },
            { author: "ফাতেমা তুজ জোহরা", text: "ডিফারেন্সিয়েশনের সূত্রগুলো খুব সহজে মনে রাখার টেকনিকটা দারুণ লেগেছে!", time: "গতকাল, দুপুর ২:৩০" }
        ]));

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            if (posts.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">এখনো কোনো পোস্ট নেই। প্রথম পোস্টটি তুমিই করো!</p>';
                return;
            }

            container.innerHTML = posts.map((post, index) => `
                <div class="post-box">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <h6 class="fw-bold text-dark mb-0"><i class="fa-solid fa-user-circle text-primary me-1"></i> ${escapeHtml(post.author)}</h6>
                        <span class="text-muted small">${escapeHtml(post.time)}</span>
                    </div>
                    <p class="mb-0 mt-2 text-secondary">${escapeHtml(post.text)}</p>
                </div>
            `).join('');
        }

        function addPost() {
            const author = document.getElementById('authorInput').value.trim() || "অজ্ঞাত শিক্ষার্থী";
            const text = document.getElementById('postInput').value.trim();

            if (!text) {
                alert('দয়া করে কিছু লিখে পোস্ট করুন।');
                return;
            }

            const now = new Date();
            const timeStr = `আজ, ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;

            posts.unshift({ author, text, time: timeStr });
            localStorage.setItem('wkd_forum_posts', JSON.stringify(posts));

            document.getElementById('postInput').value = '';
            document.getElementById('authorInput').value = '';
            renderPosts();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.onload = renderPosts;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
