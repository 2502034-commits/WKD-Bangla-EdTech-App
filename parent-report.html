<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অভিভাবক রিপোর্ট - WKD EdTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">👨‍👩‍👧 অভিভাবক পোর্টাল</h1>
        <a href="dashboard.html" class="bg-white text-blue-600 px-4 py-1 rounded-full font-semibold text-sm hover:bg-gray-100 transition">ফিরে যান</a>
    </nav>

    <!-- স্ক্রিনে মেসেজ দেখানোর জন্য একটি ডিবাগ এরিয়া -->
    <div id="debug-message" class="p-4 m-4 text-center font-bold text-lg rounded-lg hidden"></div>

    <div class="p-4 max-w-2xl mx-auto mt-6">
        
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 mb-6 flex items-center space-x-4">
            <div id="avatar" class="bg-blue-100 text-blue-600 rounded-full h-16 w-16 flex items-center justify-center text-2xl font-bold">
                ...
            </div>
            <div>
                <h2 id="student-name" class="text-2xl font-bold text-gray-800">লোড হচ্ছে...</h2>
                <p class="text-gray-500">শ্রেণি: <span id="student-class">...</span></p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow border border-gray-100 text-center">
                <p class="text-gray-500 text-sm mb-1">কুইজের গড় স্কোর</p>
                <p class="text-3xl font-bold text-green-600"><span id="math-score">০</span>%</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border border-gray-100 text-center">
                <p class="text-gray-500 text-sm mb-1">ক্লাসের উপস্থিতি</p>
                <p class="text-3xl font-bold text-blue-600"><span id="attendance-score">০</span>%</p>
            </div>
        </div>
    </div>

   <!-- Firebase Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7qYnhkbEex4n5foZ8Ov_aFDdv13WKY",
        authDomain: "wkd-edtech-app.firebaseapp.com",
        projectId: "wkd-edtech-app",
        storageBucket: "wkd-edtech-app.appspot.com",
        messagingSenderId: "45418311366",
        appId: "1:45418311366:web:1999d23b19bebde1fe65c7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ডাটা লোড করার ফাংশন
    async function loadStudentData(uid, email = "") {
        try {
            const docRef = doc(db, "Users", uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                let displayName = data.name || (email ? email.split('@')[0] : "শিক্ষার্থী");
                
                document.getElementById('student-name').innerText = displayName;
                document.getElementById('avatar').innerText = displayName.charAt(0).toUpperCase();
                document.getElementById('student-class').innerText = data.class || "৯ম";
                document.getElementById('math-score').innerText = data.mathScore || "0";
                document.getElementById('attendance-score').innerText = data.attendance || "0";
            } else {
                document.getElementById('student-name').innerText = "নতুন শিক্ষার্থী";
                document.getElementById('student-class').innerText = "৯ম";
            }
        } catch (error) {
            console.error("Error getting document:", error);
        }
    }

    // ১. প্রথমে চেক করব লিংকে (URL-এ) কোনো UID আছে কিনা
    const urlParams = new URLSearchParams(window.location.search);
    const uidFromUrl = urlParams.get('uid');

    if (uidFromUrl) {
        // লিংকে UID আছে, সরাসরি ডাটা লোড করি
        loadStudentData(uidFromUrl);
    } else {
        // লিংকে UID নেই, ফায়ারবেস চেক করি
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadStudentData(user.uid, user.email);
            } else {
                document.getElementById('student-name').innerText = "লগইন নেই";
                document.getElementById('student-class').innerText = "-";
                
                const debugDiv = document.getElementById('debug-message');
                debugDiv.classList.remove('hidden');
                debugDiv.innerText = "সমস্যা: আপনি লগইন করা নেই! দয়া করে ড্যাশবোর্ডে ফিরে গিয়ে আবার লগইন করুন।";
                debugDiv.className = "p-4 m-4 text-center font-bold text-lg rounded-lg bg-red-100 text-red-700 border border-red-400";
            }
        });
    }
</script>
</body>
</html>
