<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অভিভাবক রিপোর্ট - WKD EdTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- হেডার -->
    <nav class="bg-blue-600 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold">👨‍👩‍👧 অভিভাবক পোর্টাল</h1>
        <a href="dashboard.html" class="bg-white text-blue-600 px-4 py-1 rounded-full font-semibold text-sm hover:bg-gray-100 transition">ফিরে যান</a>
    </nav>

    <div class="p-4 max-w-2xl mx-auto mt-6">
        
        <!-- সন্তানের প্রোফাইল কার্ড -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 mb-6 flex items-center space-x-4">
            <div id="avatar" class="bg-blue-100 text-blue-600 rounded-full h-16 w-16 flex items-center justify-center text-2xl font-bold">
                ...
            </div>
            <div>
                <h2 id="student-name" class="text-2xl font-bold text-gray-800">লোড হচ্ছে...</h2>
                <p class="text-gray-500">শ্রেণি: <span id="student-class">...</span></p>
            </div>
        </div>

        <!-- অগ্রগতির সারসংক্ষেপ -->
        <h3 class="text-lg font-bold text-gray-700 mb-3 ml-2">সাপ্তাহিক রিপোর্ট</h3>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow border border-gray-100 text-center">
                <p class="text-gray-500 text-sm mb-1">কুইজের গড় স্কোর</p>
                <p class="text-3xl font-bold text-green-600"><span id="math-score">০</span>%</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border border-gray-100 text-center">
                <p class="text-gray-500 text-sm mb-1">ক্লাসের উপস্থিতি</p>
                <p class="text-3xl font-bold text-blue-600"><span id="attendance-score">০</span>%</p>
            </div>
        </div>

        <!-- বাকি ডেমো ডাটা (কার্যক্রম ও শিক্ষকের পরামর্শ) -->
        <h3 class="text-lg font-bold text-gray-700 mb-3 ml-2">সাম্প্রতিক কার্যক্রম</h3>
        <div class="bg-white rounded-xl shadow border border-gray-100 overflow-hidden mb-6">
            <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                <div>
                    <p class="font-semibold text-gray-800">সাপ্তাহিক গণিত পরীক্ষা</p>
                    <p class="text-sm text-gray-500">আজ, সকাল ১০:০০</p>
                </div>
                <span class="bg-green-100 text-green-700 font-bold px-3 py-1 rounded-full text-sm">সম্পন্ন</span>
            </div>
        </div>

    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // আপনার Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyC7qYnhkbEex4n5foZ8Ov_aFDdv13WKY",
            authDomain: "wkd-edtech-app.firebaseapp.com",
            projectId: "wkd-edtech-app",
            storageBucket: "wkd-edtech-app.appspot.com",
            messagingSenderId: "45418311366",
            appId: "1:45418311366:web:1999d23b19bebde1fe65c7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ডাটাবেস থেকে ডাটা আনা
        async function loadStudentData() {
            // আপনার কালেকশনের নাম 'Users' এবং Document ID নিচে বসানো হলো
            const docRef = doc(db, "Users", "1BhcqWVkdE8EV54vgKXT");
            
            try {
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // HTML-এ ডাটা বসানো
                    document.getElementById('student-name').innerText = data.name;
                    document.getElementById('avatar').innerText = data.name.charAt(0);
                    document.getElementById('student-class').innerText = data.class;
                    document.getElementById('math-score').innerText = data.mathScore;
                    document.getElementById('attendance-score').innerText = data.attendance;
                } else {
                    console.log("No such document!");
                }
            } catch (error) {
                console.error("Error getting document:", error);
            }
        }

        // ফাংশন কল করা
        loadStudentData();
    </script>
</body>
</html>
